name: Publish CLI to npm

on:
  push:
    branches: [main]
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/references/**'
      - '.github/templates/**'
      - '.github/copilot-instructions.md'
      - 'cli/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build assets
        working-directory: cli
        run: node scripts/copy-assets.js

      - name: Check if version changed
        id: version-check
        working-directory: cli
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view pbi-agent-squad version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Publishing v$LOCAL_VERSION (npm has v$PUBLISHED_VERSION)"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version $LOCAL_VERSION already published, skipping"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        working-directory: cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
